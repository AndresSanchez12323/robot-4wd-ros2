name: Desplegar modelos en AWS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: robot-modelos-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.ROBOT_AWS_INSTANCE_ID != '' && vars.ROBOT_AWS_ROLE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INSTANCE_ID: ${{ vars.ROBOT_AWS_INSTANCE_ID }}
    steps:
      - name: Autenticar con AWS
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.ROBOT_AWS_ROLE }}
          aws-region: us-east-1
          allowed-account-ids: "473309510385"
      - name: Desplegar revisión publicada y consultar resultado
        shell: bash
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name easo-robot-modelos-deploy --parameters "Commit=$GITHUB_SHA" \
            --query Command.CommandId --output text)
          echo "SSM: $command_id"
          for ((attempt=0; attempt<160; attempt++)); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              ''|Pending|InProgress|Delayed|Cancelling) sleep 15 ;;
              *)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query '{status:Status,code:ResponseCode}' --output json
                exit 1 ;;
            esac
          done
          echo 'Se agotó el tiempo de espera. Consulta la ejecución en Systems Manager.'
          exit 1
