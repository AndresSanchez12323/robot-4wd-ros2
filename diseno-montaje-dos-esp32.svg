<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450"><rect width="1800" height="1450" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b42} .title{font-size:34px;font-weight:bold}.h{font-size:23px;font-weight:bold}.t{font-size:19px}.small{font-size:16px}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="45" y="55" class="title">ROBOT 4WD · DOS ESP32</text>
<text x="45" y="90" class="t">Vista superior orientativa + mapa de conexiones independientes. Diseño todavía sin prueba física.</text>
<rect x="100" y="150" width="830" height="1030" rx="90" fill="#e3eaf1" stroke="#8da0b3" stroke-width="3"/>
<text x="425" y="140" class="h">↑ FRENTE ↑</text>
<rect x="370" y="180" width="290" height="85" rx="15" fill="#d2f3ee" stroke="#99a9ba" stroke-width="2"/>
<text x="388" y="212" class="h">CÁMARA OV56</text>
<text x="388" y="242" class="small">Cable flexible → conector S3</text>
<rect x="320" y="300" width="390" height="120" rx="15" fill="#dbe9ff" stroke="#99a9ba" stroke-width="2"/>
<text x="338" y="332" class="h">ESP32-S3 · ANTERIOR</text>
<text x="338" y="362" class="small">Cámara y comunicación con computador</text>
<text x="338" y="389" class="small">UART propuesta: TX41 / RX42</text>
<rect x="310" y="570" width="410" height="145" rx="15" fill="#dbe9ff" stroke="#99a9ba" stroke-width="2"/>
<text x="328" y="602" class="h">ESP32 DevKitC V4 · NUEVO</text>
<text x="328" y="632" class="small">Control local de los cuatro motores</text>
<text x="328" y="659" class="small">Cuatro encoders + IMU</text>
<text x="328" y="686" class="small">UART: RX16 / TX17</text>
<rect x="405" y="455" width="225" height="85" rx="15" fill="#e9ddfa" stroke="#99a9ba" stroke-width="2"/>
<text x="423" y="487" class="h">MPU6050</text>
<text x="423" y="517" class="small">SDA21 · SCL22</text>
<rect x="125" y="760" width="310" height="135" rx="15" fill="#d9efdf" stroke="#99a9ba" stroke-width="2"/>
<text x="143" y="792" class="h">TB6612 IZQUIERDO</text>
<text x="143" y="822" class="small">Canal A → FL · Canal B → RL</text>
<text x="143" y="849" class="small">Seis señales independientes</text>
<text x="143" y="876" class="small">VCC3V3 · STBY2 · GND</text>
<rect x="600" y="760" width="310" height="135" rx="15" fill="#d9efdf" stroke="#99a9ba" stroke-width="2"/>
<text x="618" y="792" class="h">TB6612 DERECHO</text>
<text x="618" y="822" class="small">Canal A → FR · Canal B → RR</text>
<text x="618" y="849" class="small">Seis señales independientes</text>
<text x="618" y="876" class="small">VCC3V3 · STBY2 · GND</text>
<rect x="30" y="300" width="110" height="205" rx="28" fill="#293747"/><ellipse cx="85" cy="402" rx="35" ry="65" fill="#f4bd32"/>
<text x="65" y="408" class="h">FL</text>
<rect x="890" y="300" width="110" height="205" rx="28" fill="#293747"/><ellipse cx="945" cy="402" rx="35" ry="65" fill="#f4bd32"/>
<text x="925" y="408" class="h">FR</text>
<rect x="30" y="930" width="110" height="205" rx="28" fill="#293747"/><ellipse cx="85" cy="1032" rx="35" ry="65" fill="#f4bd32"/>
<text x="65" y="1038" class="h">RL</text>
<rect x="890" y="930" width="110" height="205" rx="28" fill="#293747"/><ellipse cx="945" cy="1032" rx="35" ry="65" fill="#f4bd32"/>
<text x="925" y="1038" class="h">RR</text>
<rect x="150" y="300" width="145" height="90" rx="15" fill="#fff0ba" stroke="#99a9ba" stroke-width="2"/>
<text x="168" y="332" class="h">MOTOR FL</text>
<rect x="730" y="300" width="145" height="90" rx="15" fill="#fff0ba" stroke="#99a9ba" stroke-width="2"/>
<text x="748" y="332" class="h">MOTOR FR</text>
<rect x="150" y="930" width="145" height="90" rx="15" fill="#fff0ba" stroke="#99a9ba" stroke-width="2"/>
<text x="168" y="962" class="h">MOTOR RL</text>
<rect x="730" y="930" width="145" height="90" rx="15" fill="#fff0ba" stroke="#99a9ba" stroke-width="2"/>
<text x="748" y="962" class="h">MOTOR RR</text>
<rect x="150" y="425" width="145" height="90" rx="15" fill="#eadff7" stroke="#99a9ba" stroke-width="2"/>
<text x="168" y="457" class="h">LM393 FL</text>
<text x="168" y="487" class="small">OUT → 34</text>
<rect x="730" y="425" width="145" height="90" rx="15" fill="#eadff7" stroke="#99a9ba" stroke-width="2"/>
<text x="748" y="457" class="h">LM393 FR</text>
<text x="748" y="487" class="small">OUT → VP36</text>
<rect x="150" y="1045" width="145" height="90" rx="15" fill="#eadff7" stroke="#99a9ba" stroke-width="2"/>
<text x="168" y="1077" class="h">LM393 RL</text>
<text x="168" y="1107" class="small">OUT → 35</text>
<rect x="730" y="1045" width="145" height="90" rx="15" fill="#eadff7" stroke="#99a9ba" stroke-width="2"/>
<text x="748" y="1077" class="h">LM393 RR</text>
<text x="748" y="1107" class="small">OUT → VN39</text>
<path d="M515 265 V300" class="wire" stroke="#198c88" />
<path d="M645 420 V550 H680 V570" class="wire" stroke="#198c88" stroke-dasharray="9 7"/>
<path d="M515 540 V570" class="wire" stroke="#8c54b7" />
<path d="M390 715 V735 H280 V760" class="wire" stroke="#3478c8" />
<path d="M640 715 V735 H755 V760" class="wire" stroke="#3478c8" />
<path d="M170 760 H110 V400 H220 V390" class="wire" stroke="#d45145" />
<path d="M240 895 V930" class="wire" stroke="#d45145" />
<path d="M865 760 H920 V400 H805 V390" class="wire" stroke="#d45145" />
<path d="M805 895 V930" class="wire" stroke="#d45145" />
<path d="M295 475 H305 V620 H310" class="wire" stroke="#8c54b7" />
<path d="M730 475 H725 V620 H720" class="wire" stroke="#8c54b7" />
<path d="M295 1090 H310 V685" class="wire" stroke="#8c54b7" />
<path d="M730 1090 H720 V685" class="wire" stroke="#8c54b7" />
<text x="335" y="1135" class="small">Baterías bajas y centradas; posición por ajustar.</text>
<text x="335" y="1160" class="small">Drivers y placas sobre separadores aislantes.</text>
<rect x="1000" y="150" width="750" height="350" rx="15" fill="#ffffff" stroke="#99a9ba" stroke-width="2"/>
<text x="1018" y="182" class="h">1 · DRIVERS → DEVKITC V4</text>
<text x="1018" y="212" class="small">Pin driver            IZQUIERDO              DERECHO</text>
<text x="1018" y="239" class="small">AIN1                  GPIO13                 GPIO18</text>
<text x="1018" y="266" class="small">AIN2                  GPIO14                 GPIO19</text>
<text x="1018" y="293" class="small">PWMA                  GPIO25                 GPIO23</text>
<text x="1018" y="320" class="small">BIN1                  GPIO26                 GPIO4</text>
<text x="1018" y="347" class="small">BIN2                  GPIO27                 GPIO15*</text>
<text x="1018" y="374" class="small">PWMB                  GPIO32                 GPIO33</text>
<text x="1018" y="401" class="small">STBY                  GPIO2*                 GPIO2*</text>
<text x="1018" y="428" class="small">VCC → 3V3 común · GND → tierra común · VM → fuente motores</text>
<text x="1018" y="455" class="small">AO1/AO2: delantero · BO1/BO2: trasero</text>
<rect x="1000" y="525" width="750" height="190" rx="15" fill="#ffffff" stroke="#99a9ba" stroke-width="2"/>
<text x="1018" y="557" class="h">2 · ENTRE PLACAS / SENSORES</text>
<text x="1018" y="587" class="small">S3 TX41 → DevKitC RX16 · DevKitC TX17 → S3 RX42</text>
<text x="1018" y="614" class="small">GND S3 ↔ GND DevKitC. No unir las dos salidas 3V3.</text>
<text x="1018" y="641" class="small">UART del S3: propuesta de referencia, pendiente de validación.</text>
<text x="1018" y="668" class="small">Encoders: OUT FL34 / RL35 / FR36(VP) / RR39(VN).</text>
<text x="1018" y="695" class="small">IMU: SDA21 / SCL22. Niveles de sensores por verificar.</text>
<rect x="1000" y="740" width="750" height="190" rx="15" fill="#fff0ce" stroke="#99a9ba" stroke-width="2"/>
<text x="1018" y="772" class="h">3 · CONDICIONES DEL DISEÑO</text>
<text x="1018" y="802" class="small">* GPIO2: STBY bajo al arrancar/programar; verificar breakout.</text>
<text x="1018" y="829" class="small">* GPIO15: función de arranque; puede cambiar mensajes ROM.</text>
<text x="1018" y="856" class="small">Encoders: OUT compatible con 3,3 V; no aplicar 5 V al GPIO.</text>
<text x="1018" y="883" class="small">Tensión de motores, fusible y reguladores pendientes de medidas.</text>
<text x="1018" y="910" class="small">D6: ubicación/interfaz pendientes. No está conectado en este plano.</text>
<rect x="1000" y="955" width="750" height="210" rx="15" fill="#ffffff" stroke="#99a9ba" stroke-width="2"/>
<text x="1018" y="987" class="h">4 · CABLEADO POR ETAPAS</text>
<text x="1018" y="1017" class="small">1. Fijar placas, drivers y sensores; ordenar cables.</text>
<text x="1018" y="1044" class="small">2. Revisar motor A delantero / motor B trasero por lado.</text>
<text x="1018" y="1071" class="small">3. Cablear GND, VCC lógico y señales independientes.</text>
<text x="1018" y="1098" class="small">4. Verificar encoders e IMU antes de alimentar.</text>
<text x="1018" y="1125" class="small">5. Probar UART y arranque seguro con VM desconectado.</text>
<text x="1018" y="1152" class="small">6. Instalar alimentación y probar un motor por vez.</text>
<rect x="45" y="1220" width="1705" height="165" rx="15" fill="#ffffff" stroke="#99a9ba" stroke-width="2"/>
<text x="63" y="1252" class="h">ALIMENTACIÓN · BATERÍA AL FINAL</text>
<text x="63" y="1282" class="small">Batería (+) → fusible → interruptor → reguladores/distribución.</text>
<text x="63" y="1309" class="small">Rama motores: salida verificada → VM izquierdo + VM derecho. No pasa por el ESP32.</text>
<text x="63" y="1336" class="small">Rama lógica: alimentación verificada para ambas placas. No unir salidas 3V3 de placas distintas.</text>
<text x="63" y="1363" class="small">GND común: fuente, ambos drivers, ambos ESP32 y sensores. Retorno de motores separado de cables finos de lógica.</text>
</svg>
