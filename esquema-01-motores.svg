<text x="63" y="1144" class="head">CONEXIONES COMPARTIDAS</text>
<text x="63" y="1178" class="s">S1: GPIO2 → STBY izquierdo y derecho. No conectar STBY permanentemente a 3V3.</text>
<text x="63" y="1207" class="s">L1/L2: 3V3 DevKitC → distribución → VCC de ambos drivers. G1/G2: GND → GND de ambos drivers.</text>
<rect x="45" y="1260" width="1500" height="225" rx="14" fill="#fff" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="1294" class="head">ANTES DE ENCENDER</text>
<text x="63" y="1328" class="s">GPIO2 es pin de arranque: comprobar STBY bajo en reset; revisar si el breakout tiene pull-up o puente a VCC.</text>
<text x="63" y="1357" class="s">GPIO15 (*) también es pin de arranque: la carga puede alterar mensajes ROM. No afecta la independencia del motor.</text>
<text x="63" y="1386" class="s">No unir AIN1 con BIN1, AIN2 con BIN2 ni PWMA con PWMB. Los seis GPIO de cada driver son distintos.</text>
<text x="63" y="1415" class="s">VM se conecta solo a la fuente de motores verificada. Ver lámina 03 para alimentación y desacoplo.</text>
<text x="63" y="1444" class="s">El sentido real se confirma con ruedas elevadas. Rojo/negro en las salidas no garantiza avance.</text></svg>
