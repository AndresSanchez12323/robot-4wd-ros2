server {
    listen 8080;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_read_timeout 90s;

    location ~ ^/(?<servicio>llm|vlm|gpu)/(?<ruta>salud|interpretar|ver)$ {
        proxy_pass http://$servicio:8080/$ruta;
    }

    location / {
        return 404;
    }
}
