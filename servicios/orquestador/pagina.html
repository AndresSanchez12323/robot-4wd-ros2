<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mision del robot</title>
<style>
body{font:16px Arial;background:#142b43;color:#fff;margin:24px auto;max-width:820px;padding:0 16px}
button{font-size:18px;padding:12px 18px;border:0;border-radius:8px;margin-right:8px;cursor:pointer}
#ir{background:#77dec4}#parar{background:#ff6666}
input{font-size:18px;padding:10px;width:100%;box-sizing:border-box}
pre{white-space:pre-wrap;background:#203c55;padding:14px;border-radius:8px}
.rojo{color:#ffb4b4}.verde{color:#b6f3df}
</style>
</head>
<body>
<h1>Mision del robot</h1>
<p>Escribe a donde debe ir, en cualquier frase o idioma. Si un servicio esta apagado, el carro no se mueve.</p>
<input id="frase" placeholder="ve a la gaseosa">
<p><button id="ir">IR</button><button id="parar">PARAR</button></p>
<pre id="servicios">Revisando servicios...</pre>
<pre id="mision">Sin mision.</pre>
<script>
let token = sessionStorage.getItem('token') || '';
if (!token) { token = prompt('Token del orquestador') || ''; sessionStorage.setItem('token', token); }
async function salud(){
  try{
    const r = await fetch('/api/salud', {cache:'no-store'});
    const d = await r.json();
    const lineas = Object.entries(d.servicios || {}).map(([nombre, estado]) => {
      const sano = estado && estado.sano;
      return nombre + ': ' + (sano ? 'LISTO' : 'APAGADO');
    });
    document.getElementById('servicios').textContent = (d.listo ? 'Todos los servicios listos' : 'Mision bloqueada') + '\n' + lineas.join('\n');
  }catch(e){
    document.getElementById('servicios').textContent = 'No pude leer el estado de los servicios';
  }
}
async function mision(){
  try{
    const r = await fetch('/api/mision', {cache:'no-store'});
    const d = await r.json();
    document.getElementById('mision').textContent =
      'Estado: ' + d.estado + '\n' + d.detalle +
      '\nLugares: ' + (d.nombres || []).join(', ') +
      '\nAhora: ' + (d.lugar || '-') + ' | accion: ' + (d.accion || '-');
  }catch(e){}
}
document.getElementById('ir').onclick = async () => {
  const texto = document.getElementById('frase').value.trim();
  if(!texto) return;
  const r = await fetch('/api/mision', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify({texto})});
  document.getElementById('mision').textContent = await r.text();
};
document.getElementById('parar').onclick = async () => {
  await fetch('/api/parar', {method:'POST', headers:{'Authorization':'Bearer '+token}});
};
setInterval(salud, 1000);
setInterval(mision, 700);
salud(); mision();
</script>
</body>
</html>
