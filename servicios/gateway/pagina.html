<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mision del robot</title>
<style>
body{font:16px Arial;background:#142b43;color:#fff;margin:24px auto;max-width:820px;padding:0 16px}
button{font-size:18px;padding:12px 18px;border:0;border-radius:8px;margin-right:8px;cursor:pointer}
#ir{background:#77dec4}#parar{background:#ff6666}#copiar{background:#d7e4f5;color:#142b43}
input{font-size:18px;padding:10px;width:100%;box-sizing:border-box}
pre{white-space:pre-wrap;background:#203c55;padding:14px;border-radius:8px}
</style>
</head>
<body>
<h1>Mision del robot</h1>
<p>Esta pagina solo habla con GraphQL. Si un servicio esta apagado, la consulta falla y el carro no se mueve.</p>
<input id="frase" placeholder="ve a la gaseosa">
<p><button id="ir">IR</button><button id="parar">PARAR</button></p>
<pre id="servicios">Revisando servicios...</pre>
<pre id="mision">Sin mision.</pre>
<h2>Decisiones</h2>
<p>Esta lista se puede copiar y pegar para revisar que detecto el carro y que orden tomo.</p>
<p><button id="copiar" type="button">Copiar lista</button></p>
<pre id="bitacora">Sin decisiones todavia.</pre>
<script>
let token = sessionStorage.getItem('token') || '';
if (!token) { token = prompt('Token del gateway') || ''; sessionStorage.setItem('token', token); }
async function gql(query, variables, conToken){
  const headers = {'Content-Type':'application/json'};
  if (conToken) headers.Authorization = 'Bearer ' + token;
  const r = await fetch('/graphql', {method:'POST', cache:'no-store', headers, body:JSON.stringify({query, variables})});
  const d = await r.json();
  if (d.errors && d.errors.length) throw new Error(d.errors.map(e => e.message).join('; '));
  return d.data;
}
async function salud(){
  try{
    const d = await gql('query { salud { listo servicios { nombre sano } } }');
    const lineas = d.salud.servicios.map(s => s.nombre + ': ' + (s.sano ? 'LISTO' : 'APAGADO'));
    document.getElementById('servicios').textContent = (d.salud.listo ? 'Todos los servicios listos' : 'Mision bloqueada') + '\n' + lineas.join('\n');
  }catch(e){
    document.getElementById('servicios').textContent = 'GraphQL no respondio';
  }
}
function textoBitacora(pasos){
  if(!pasos || !pasos.length) return 'Sin decisiones todavia.';
  return pasos.map((p, i) => (i + 1) + '. ' + (p.estado || '-') + ' | ' + (p.lugar || '-') + ' | ' + (p.accion || '-') + ' | ' + (p.detalle || '-')).join('\n');
}
async function mision(){
  try{
    const d = await gql('query { mision { estado detalle nombres lugar accion bitacora { estado detalle lugar accion } } }');
    const m = d.mision;
    document.getElementById('mision').textContent =
      'Estado: ' + m.estado + '\n' + m.detalle +
      '\nLugares: ' + (m.nombres || []).join(', ') +
      '\nAhora: ' + (m.lugar || '-') + ' | accion: ' + (m.accion || '-');
    document.getElementById('bitacora').textContent = textoBitacora(m.bitacora);
  }catch(e){}
}
document.getElementById('ir').onclick = async () => {
  const texto = document.getElementById('frase').value.trim();
  if(!texto) return;
  try{
    await gql('mutation ($texto:String!){ iniciar(texto:$texto){ estado detalle } }', {texto}, true);
  }catch(e){
    document.getElementById('mision').textContent = e.message;
  }
};
document.getElementById('parar').onclick = async () => {
  try{ await gql('mutation { parar { estado detalle } }', {}, true); }catch(e){
    document.getElementById('mision').textContent = e.message;
  }
};
document.getElementById('copiar').onclick = async () => {
  const texto = document.getElementById('bitacora').textContent;
  try{
    await navigator.clipboard.writeText(texto);
    document.getElementById('copiar').textContent = 'Lista copiada';
  }catch(e){
    document.getElementById('copiar').textContent = 'Selecciona la lista y copiala';
  }
};
setInterval(salud, 1000);
setInterval(mision, 700);
salud(); mision();
</script>
</body>
</html>
