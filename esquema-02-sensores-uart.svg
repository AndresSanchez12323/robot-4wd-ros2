<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510"><rect width="1600" height="1510" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#192f45}.title{font-size:32px;font-weight:bold}.head{font-size:23px;font-weight:bold}.t{font-size:20px}.s{font-size:17px}.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="40" y="50" class="title">02 · ENCODERS, IMU Y ENLACE ENTRE PLACAS</text>
<text x="40" y="85" class="s">Línea continua: señal definida. Línea punteada: alimentación o pin del S3 pendiente de validar.</text>
<rect x="1070" y="140" width="480" height="640" rx="14" fill="#dceaff" stroke="#8fa4b8" stroke-width="2"/>
<text x="1088" y="174" class="head">ESP32 DevKitC V4</text>
<rect x="45" y="140" width="470" height="130" rx="14" fill="#eee3fa" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="174" class="head">LM393 FL</text>
<text x="63" y="208" class="s">GND → GND común · AO: sin conectar</text>
<text x="63" y="237" class="s">VCC: verificar módulo y nivel de OUT</text>
<text x="440" y="197" class="s">OUT</text>
<path d="M515 190 H792.5 V190 H1070" class="wire" stroke="#8b4ac4" />
<circle cx="515" cy="190" r="4" fill="#8b4ac4"/><circle cx="1070" cy="190" r="4" fill="#8b4ac4"/>
<text x="535" y="181" class="s">E1</text>
<text x="1090" y="196" class="t">GPIO34</text>
<rect x="45" y="300" width="470" height="130" rx="14" fill="#eee3fa" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="334" class="head">LM393 RL</text>
<text x="63" y="368" class="s">GND → GND común · AO: sin conectar</text>
<text x="63" y="397" class="s">VCC: verificar módulo y nivel de OUT</text>
<text x="440" y="357" class="s">OUT</text>
<path d="M515 350 H792.5 V350 H1070" class="wire" stroke="#8b4ac4" />
<circle cx="515" cy="350" r="4" fill="#8b4ac4"/><circle cx="1070" cy="350" r="4" fill="#8b4ac4"/>
<text x="535" y="341" class="s">E2</text>
<text x="1090" y="356" class="t">GPIO35</text>
<rect x="45" y="460" width="470" height="130" rx="14" fill="#eee3fa" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="494" class="head">LM393 FR</text>
<text x="63" y="528" class="s">GND → GND común · AO: sin conectar</text>
<text x="63" y="557" class="s">VCC: verificar módulo y nivel de OUT</text>
<text x="440" y="517" class="s">OUT</text>
<path d="M515 510 H792.5 V510 H1070" class="wire" stroke="#8b4ac4" />
<circle cx="515" cy="510" r="4" fill="#8b4ac4"/><circle cx="1070" cy="510" r="4" fill="#8b4ac4"/>
<text x="535" y="501" class="s">E3</text>
<text x="1090" y="516" class="t">VP / GPIO36</text>
<rect x="45" y="620" width="470" height="130" rx="14" fill="#eee3fa" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="654" class="head">LM393 RR</text>
<text x="63" y="688" class="s">GND → GND común · AO: sin conectar</text>
<text x="63" y="717" class="s">VCC: verificar módulo y nivel de OUT</text>
<text x="440" y="677" class="s">OUT</text>
<path d="M515 670 H792.5 V670 H1070" class="wire" stroke="#8b4ac4" />
<circle cx="515" cy="670" r="4" fill="#8b4ac4"/><circle cx="1070" cy="670" r="4" fill="#8b4ac4"/>
<text x="535" y="661" class="s">E4</text>
<text x="1090" y="676" class="t">VN / GPIO39</text>
<rect x="45" y="820" width="470" height="195" rx="14" fill="#eee3fa" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="854" class="head">MPU6050</text>
<text x="63" y="888" class="s">VCC: verificar placa; I2C a 3,3 V</text>
<text x="63" y="917" class="s">GND → común · AD0 → GND (0x68)</text>
<text x="63" y="946" class="s">INT, XDA, XCL: sin conectar</text>
<rect x="1070" y="820" width="480" height="195" rx="14" fill="#dceaff" stroke="#8fa4b8" stroke-width="2"/>
<text x="1088" y="854" class="head">ESP32 DevKitC V4</text>
<path d="M515 925 H792.5 V925 H1070" class="wire" stroke="#8b4ac4" />
<circle cx="515" cy="925" r="4" fill="#8b4ac4"/><circle cx="1070" cy="925" r="4" fill="#8b4ac4"/>
<text x="535" y="916" class="s">U1: SDA → GPIO21</text>
<path d="M515 975 H792.5 V975 H1070" class="wire" stroke="#8b4ac4" />
<circle cx="515" cy="975" r="4" fill="#8b4ac4"/><circle cx="1070" cy="975" r="4" fill="#8b4ac4"/>
<text x="535" y="966" class="s">U2: SCL → GPIO22</text>
<rect x="45" y="1060" width="470" height="170" rx="14" fill="#dceaff" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="1094" class="head">ESP32-S3 ANTERIOR</text>
<text x="63" y="1128" class="s">Cámara → conector flexible propio</text>
<text x="63" y="1157" class="s">GPIO41 TX / GPIO42 RX: propuestos</text>
<rect x="1070" y="1060" width="480" height="170" rx="14" fill="#dceaff" stroke="#8fa4b8" stroke-width="2"/>
<text x="1088" y="1094" class="head">ESP32 DevKitC V4</text>
<path d="M515 1125 H792.5 V1125 H1070" class="wire" stroke="#168d87" stroke-dasharray="8 6"/>
<circle cx="515" cy="1125" r="4" fill="#168d87"/><circle cx="1070" cy="1125" r="4" fill="#168d87"/>
<text x="535" y="1116" class="s">C1: S3 TX41 → DevKitC RX16</text>
<path d="M515 1175 H792.5 V1175 H1070" class="wire" stroke="#168d87" stroke-dasharray="8 6"/>
<circle cx="515" cy="1175" r="4" fill="#168d87"/><circle cx="1070" cy="1175" r="4" fill="#168d87"/>
<text x="535" y="1166" class="s">C2: DevKitC TX17 → S3 RX42</text>
<path d="M515 1210 H792.5 V1210 H1070" class="wire" stroke="#26384a" />
<circle cx="515" cy="1210" r="4" fill="#26384a"/><circle cx="1070" cy="1210" r="4" fill="#26384a"/>
<text x="535" y="1201" class="s">C3: GND ↔ GND</text>
<rect x="45" y="1270" width="1505" height="195" rx="14" fill="#fff0ce" stroke="#8fa4b8" stroke-width="2"/>
<text x="63" y="1304" class="head">CONDICIONES DE MONTAJE</text>
<text x="63" y="1338" class="s">Los LM393 no alimentan motores. El disco gira; el sensor queda fijo. OUT no debe superar el nivel permitido del GPIO.</text>
<text x="63" y="1367" class="s">GPIO34–39 no tienen pull-up interno. Comprobar el del módulo; si falta, resolverlo antes de probar pulsos.</text>
<text x="63" y="1396" class="s">No unir 3V3 de ambas placas. UART es de 3,3 V; probar con VM desconectado y ambas placas alimentadas.</text>
<text x="63" y="1425" class="s">D6 pendiente: modelo, tensión e interfaz sin confirmar. No se ha dibujado una conexión ficticia.</text></svg>
